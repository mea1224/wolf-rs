[workspace]
resolver = "2"
members = ["crates/wolf-assets", "crates/wolf-format", "crates/wolf-ir", "crates/wolf-vm", "crates/wolf-render", "crates/wolf-cli", "crates/wolf-media", "crates/wolf-player"]
default-members = ["crates/wolf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
blake3 = "=1.8.7"
unicode-normalization = "=0.1.24"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }

